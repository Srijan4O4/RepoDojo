name: RepoDojo CD Production Deployment (OCI ARM64)

on:
  push:
    branches: [main]

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Build and Publish Multi-Arch Container Images to GHCR
  # ============================================================================
  build-and-push:
    name: Build & Push GHCR Images (linux/arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 Emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Image Tag
        id: meta
        run: |
          TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build & Push Express API Image (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/repodojo-api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/repodojo-api:latest

      - name: Build & Push Python AI Service Image (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai-service
          file: ./apps/ai-service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/repodojo-ai-service:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/repodojo-ai-service:latest

  # ============================================================================
  # 2. Automated Rolling Deployment to OCI Control Plane VM (Decision 14.2)
  # ============================================================================
  deploy:
    name: Rolling Deploy to OCI VM
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Execute SSH Rolling Deployment with Health Verification
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            cd /opt/repodojo

            echo "[+] Pulling verified image digests for tag ${IMAGE_TAG}..."
            docker compose -f infra/docker/compose.prod.yml pull

            echo "[+] Executing graceful zero-downtime rolling restart..."
            docker compose -f infra/docker/compose.prod.yml up -d --remove-orphans

            echo "[*] Polling deep readiness health probe (/readyz)..."
            READY=0
            for i in {1..12}; do
              if curl -s -f http://127.0.0.1:5000/readyz | grep -q '"status":"healthy"'; then
                echo "[✓] Platform verified healthy at /readyz!"
                READY=1
                break
              fi
              echo "[-] Waiting for dependencies to report healthy (attempt ${i}/12)..."
              sleep 5
            done

            if [ "${READY}" -ne 1 ]; then
              echo "[!] CRITICAL: Deployment health verification failed! Rolling back..."
              docker compose -f infra/docker/compose.prod.yml rollback || docker compose -f infra/docker/compose.prod.yml restart
              exit 1
            fi
            echo "[✓] Deployment completed successfully."
